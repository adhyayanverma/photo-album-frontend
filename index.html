<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photo Album</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <h1>Photo Album</h1>
    <p class="sub">Search your photos in plain English, or upload new ones with your own labels. Deployed by CodePipeline P2.</p>
  </header>

  <main>
    <section class="card">
      <h2>Search</h2>
      <form id="search-form" class="row">
        <input id="search-input" type="text" placeholder='Try "dogs" or "show me cats and trees"' autocomplete="off" />
        <button type="submit">Search</button>
      </form>
      <p id="search-status" class="status"></p>
      <div id="results" class="grid"></div>
    </section>

    <section class="card">
      <h2>Upload</h2>
      <form id="upload-form">
        <label>Photo (JPEG or PNG, under 10 MB)
          <input id="file-input" type="file" accept="image/jpeg,image/png" required />
        </label>
        <label>Custom labels (comma separated, optional)
          <input id="labels-input" type="text" placeholder="Sam, Sally" />
        </label>
        <button type="submit">Upload</button>
      </form>
      <p id="upload-status" class="status"></p>
    </section>
  </main>

  <!-- API Gateway generated JavaScript SDK (SDK1). Unzip the SDK into ./sdk so these paths resolve. -->
  <script src="sdk/lib/axios/dist/axios.standalone.js"></script>
  <script src="sdk/lib/CryptoJS/rollups/hmac-sha256.js"></script>
  <script src="sdk/lib/CryptoJS/rollups/sha256.js"></script>
  <script src="sdk/lib/CryptoJS/components/hmac.js"></script>
  <script src="sdk/lib/CryptoJS/components/enc-base64.js"></script>
  <script src="sdk/lib/url-template/url-template.js"></script>
  <script src="sdk/lib/apiGatewayCore/sigV4Client.js"></script>
  <script src="sdk/lib/apiGatewayCore/apiGatewayClient.js"></script>
  <script src="sdk/lib/apiGatewayCore/simpleHttpClient.js"></script>
  <script src="sdk/lib/apiGatewayCore/utils.js"></script>
  <script src="sdk/apigClient.js"></script>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
